name: Build JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile
        run: |
          mkdir out
          javac -d out $(find src -name "*.java")
          javac -cp ".jar/processing 4.5.1.jar" Main.java

      - name: Package JAR
        run: |
          jar cf repo.jar -C out .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: repo
          path: repo.jar
