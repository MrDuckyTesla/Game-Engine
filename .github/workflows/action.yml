name: Build JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile
        run: |
          mkdir out
          javac -cp "jar/*" -d out $(find src -name "*.java")

      - name: Package JAR
        run: |
          jar cf engine.jar -C out .

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Game Engine
          path: engine.jar
