- name: Setup Java JDK uses: actions/setup-java@v5.7.0

  jobs: 
    build: 

      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '25'
        - name: Check java version
          run: java --version
